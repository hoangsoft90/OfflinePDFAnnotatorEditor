name: Build Android APK (debug, standalone)

on:
  workflow_dispatch:            # manual "Run workflow" button in the Actions tab
  push:
    branches: [main]            # auto-build on every push to main

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java (JDK 17 — required for Expo SDK 52+ / RN 0.7x+)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK (accepts licenses + build-tools)
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Generate native project (expo prebuild)
        run: npx expo prebuild --platform android --clean --no-install
        env:
          CI: '1'

      # assembleDebug keeps __DEV__=true (test ads, dev logs, readable stack
      # traces) and is auto-signed with the generated debug keystore (no
      # release keystore needed). plugins/with-debug-bundle.js sets
      # `debuggableVariants = []` so the JS bundle is embedded — RN 0.7x+
      # bridgeless falls back to the embedded bundle when Metro is NOT
      # running, so the APK runs standalone on a device.
      - name: Build debug APK (embedded bundle, debug-signed)
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Verify JS bundle is embedded
        working-directory: android
        run: |
          APK=$(ls app/build/outputs/apk/debug/*.apk)
          echo "APK: $APK"
          unzip -l "$APK" | grep -c 'assets/index.android.bundle' \
            || (echo '::error::debug APK has no embedded JS bundle'; exit 1)

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
