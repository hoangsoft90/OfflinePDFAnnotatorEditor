name: Build Android APK (test, debug-signed)

on:
  workflow_dispatch:            # manual "Run workflow" button in the Actions tab
  push:
    branches: [main]            # auto-build on every push to main

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java (JDK 17 — required for Expo SDK 52+ / RN 0.7x+)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK (accepts licenses + build-tools)
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Generate native project (expo prebuild)
        run: npx expo prebuild --platform android --clean --no-install
        env:
          CI: '1'

      # NOTE: we build assembleRelease, NOT assembleDebug.
      # A gradle debug variant does not embed the JS bundle and always tries
      # to load it from the Metro dev server (ws://localhost:8081) — installed
      # standalone it hangs on the splash screen forever (verified on device).
      # assembleRelease embeds the JS bundle and is auto-signed with the
      # generated debug keystore, so it installs and runs on any device with
      # NO release keystore needed.
      - name: Build APK (release variant, debug-signed — no keystore needed)
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
