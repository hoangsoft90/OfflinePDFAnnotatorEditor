name: Build Release AAB (signed)

on:
  workflow_dispatch:            # manual — run from the Actions tab on main

jobs:
  build-release-aab:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java (JDK 17 — required for Expo SDK 52+ / RN 0.7x+)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK (accepts licenses + build-tools)
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Decode release keystore from secrets
        run: |
          mkdir -p keystore
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > keystore/release.jks
          # Fail fast if the keystore did not decode to a valid JKS/PKCS12.
          keytool -list -keystore keystore/release.jks -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" | grep -E 'PrivateKeyEntry' || (echo '::error::Invalid release keystore'; exit 1)

      - name: Generate native project (expo prebuild + inject release signing)
        run: npx expo prebuild --platform android --clean --no-install
        env:
          CI: '1'
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/keystore/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Build signed release AAB
        working-directory: android
        run: ./gradlew bundleRelease

      - name: Verify AAB is signed with the release keystore
        working-directory: android
        run: |
          AAB=$(ls app/build/outputs/bundle/release/*.aab)
          echo "AAB: $AAB"
          keytool -printcert -jarfile "$AAB" 2>&1 | grep -E 'Owner:|SHA256:' | head -3

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
